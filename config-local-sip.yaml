# Local SIP Testing Configuration
# This configuration uses local storage (SQLite), local queues, and SIP telephony
# Perfect for development and testing without Azure dependencies

# Public domain (use ngrok or similar for external access)
public_domain: http://localhost:8080

# Telephony configuration - SIP mode
telephony:
  mode: sip  # Use SIP instead of Azure Communication Services
  sip:
    gateway_host: freeswitch  # FreeSWITCH container hostname (or localhost if running outside Docker)
    gateway_port: 5060
    username: "1234"  # SIP extension number
    password: "1234"  # SIP extension password
    phone_number: "1234"  # Extension number for identification
    transport: udp  # udp, tcp, or tls
    rtp_port_range_start: 10000
    rtp_port_range_end: 20000
    # Optional: STUN server for NAT traversal
    # stun_server: stun.l.google.com:19302

# Database configuration - SQLite for local development
database:
  mode: sqlite
  sqlite:
    database_path: ./data/calls.db

# Queue configuration - Local in-memory queues
queue:
  mode: local

# Cache configuration - Redis (optional, can use memory)
cache:
  mode: redis
  redis:
    host: redis
    port: 6379

# SMS configuration - Twilio
sms:
  mode: twilio
  twilio:
    account_sid: ${TWILIO_ACCOUNT_SID}
    auth_token: ${TWILIO_AUTH_TOKEN}
    phone_number: ${TWILIO_PHONE_NUMBER}

# AI/LLM configuration
llm:
  fast:
    mode: azure
    azure:
      endpoint: ${AZURE_OPENAI_ENDPOINT}
      deployment: gpt-4o-mini
      api_key: ${AZURE_OPENAI_API_KEY}
      streaming: true
  slow:
    mode: azure
    azure:
      endpoint: ${AZURE_OPENAI_ENDPOINT}
      deployment: gpt-4o
      api_key: ${AZURE_OPENAI_API_KEY}
      streaming: true

# Azure AI Search (for knowledge base)
resources:
  search:
    endpoint: ${AZURE_SEARCH_ENDPOINT}
    api_key: ${AZURE_SEARCH_API_KEY}
    index: ${AZURE_SEARCH_INDEX:-call-center-index}

# Azure Speech Services (STT/TTS)
resources:
  cognitive_service:
    endpoint: ${AZURE_COGNITIVE_SERVICE_ENDPOINT}
    api_key: ${AZURE_COGNITIVE_SERVICE_API_KEY}

# Conversation/Workflow configuration
conversation:
  initiate:
    bot_company: "Contoso"
    bot_name: "Eva"
    lang:
      default_short_code: "en-US"
      default_voice_name: "en-US-AndrewNeural"
  answer_hard_timeout_sec: 90
  answer_soft_timeout_sec: 30
  phone_silence_timeout_sec: 2

# App Configuration (for live updates)
app_configuration:
  endpoint: ${AZURE_APP_CONFIGURATION_ENDPOINT}
  # For local development, this can be optional
  refresh_interval_sec: 300

# Monitoring (optional for local)
monitoring:
  application_insights_connection_string: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}

# Prompts configuration
prompts:
  llm:
    default_system_prompt: |
      You are Eva, a helpful AI assistant for Contoso.
      You help customers with their inquiries.
  sounds:
    # Local sound files or URLs
    loading: "https://example.com/sounds/loading.wav"
