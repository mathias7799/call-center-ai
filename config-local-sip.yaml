# Local SIP Testing Configuration - Minimal Setup
# Only Azure OpenAI and Cognitive Services required

# Public domain
public_domain: http://localhost:8080

# === REQUIRED: Fill in your Azure credentials ===

# Azure OpenAI (REQUIRED)
llm:
  fast:
    mode: azure
    endpoint: https://mrxai.openai.azure.com/  # Replace with your endpoint
    model: gpt-4o-mini
    context: 128000
    azure:
      endpoint: https://mrxai.openai.azure.com/  # Replace with your endpoint
      deployment: gpt-4o-mini
      api_key: YOUR_AZURE_OPENAI_API_KEY_HERE  # Replace with your API key
      streaming: true
  slow:
    mode: azure
    endpoint: https://mrxai.openai.azure.com/  # Replace with your endpoint
    model: gpt-4o
    context: 128000
    azure:
      endpoint: https://mrxai.openai.azure.com/  # Replace with your endpoint
      deployment: gpt-4o
      api_key: YOUR_AZURE_OPENAI_API_KEY_HERE  # Replace with your API key
      streaming: true

# Azure Cognitive Services - Speech (REQUIRED)
cognitive_service:
  endpoint: https://mrxspeechtotext.cognitiveservices.azure.com/  # Replace with your endpoint
  api_key: YOUR_AZURE_COGNITIVE_API_KEY_HERE  # Replace with your API key
  region: northeurope  # Replace with your region

# Resources (REQUIRED)
resources:
  public_url: http://localhost:8080
  cognitive_service:
    endpoint: https://mrxspeechtotext.cognitiveservices.azure.com/  # Replace with your endpoint
    api_key: YOUR_AZURE_COGNITIVE_API_KEY_HERE  # Replace with your API key

# === TELEPHONY Configuration ===

# SIP Telephony
telephony:
  mode: sip
  sip:
    gateway_host: freeswitch
    gateway_port: 5060
    username: "1234"
    password: "1234"
    phone_number: "+15551001234"  # Must be valid E.164 format (use a real test number)
    transport: udp
    rtp_port_range_start: 10000
    rtp_port_range_end: 20000

# === LOCAL Storage & Cache ===

# Database - SQLite for local
database:
  mode: sqlite
  sqlite:
    database_path: ./data/calls.db

# Queue - Local in-memory
queue:
  mode: local

# Cache - Redis
cache:
  mode: redis
  redis:
    host: redis
    port: 6379

# === CONVERSATION Settings ===

conversation:
  initiate:
    bot_company: "Contoso"
    bot_name: "Eva"
    # lang has good defaults, just specify the short code
    lang:
      default_short_code: "en-US"

# === OPTIONAL Services (not used for SIP testing) ===

# App Configuration (empty = disabled)
app_configuration:
  endpoint: ""
  refresh_interval_sec: 300

# Monitoring (empty = disabled)
monitoring:
  application_insights_connection_string: ""

# Prompts
prompts:
  llm:
    default_system_prompt: |
      You are Eva, a helpful AI assistant for Contoso.
      You help customers with their inquiries.
  sounds:
    loading: "https://example.com/sounds/loading.wav"
